name: Telegram

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Текст сообщения"
        default: "TaxiCheck на связи ✅ Уведомления работают."
  push:
    paths: [".github/workflows/telegram.yml"]
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]

jobs:
  send:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Send message
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT: ${{ github.event_name }}
          INPUT: ${{ github.event.inputs.text }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          case "$EVENT" in
            workflow_run) TEXT="⚠️ TaxiCheck: сайт не обновился, нужна проверка. $RUN_URL" ;;
            workflow_dispatch) TEXT="$INPUT" ;;
            *) TEXT="TaxiCheck на связи ✅ Уведомления работают." ;;
          esac
          curl -sS -f "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" --data-urlencode "text=${TEXT}" > /dev/null
