name: Photos

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/photos.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: design }
      - name: Find candidate photos on Wikimedia Commons
        run: |
          mkdir -p photo-candidates-muc
          UA="TaxiCheckBot/1.0 (https://taxicheck.eu; info@taxicheck.eu)"
          n=0
          for q in "Munich taxi" "Taxi München" "Taxi Flughafen München" "Munich Airport taxi" "München Hauptbahnhof Taxi" "Munich skyline night" "Frauenkirche München Nacht" "Ludwigstraße München Nacht" "Marienplatz München blaue Stunde" "Munich Theatinerkirche night"; do
            curl -sSfG -A "$UA" "https://commons.wikimedia.org/w/api.php" \
              --data-urlencode "action=query" --data-urlencode "format=json" --data-urlencode "generator=search" \
              --data-urlencode "gsrnamespace=6" --data-urlencode "gsrlimit=8" --data-urlencode "gsrsearch=$q filetype:bitmap" \
              --data-urlencode "prop=imageinfo" --data-urlencode "iiprop=url|extmetadata" --data-urlencode "iiurlwidth=1600" -o /tmp/r.json -w "%{http_code} $q\n" || { echo "FAIL $q"; head -c 300 /tmp/r.json; continue; }
            head -c 200 /tmp/r.json; echo
            jq -r '.query.pages[]? | [.title, .imageinfo[0].thumburl, (.imageinfo[0].extmetadata.LicenseShortName.value // ""), (.imageinfo[0].extmetadata.Artist.value // "" | gsub("<[^>]*>";""))] | @tsv' /tmp/r.json | while IFS=$'\t' read -r title url lic artist; do
              case "$lic" in CC0*|"Public domain"*|"CC BY"*) ;; *) continue;; esac
              [ $(grep -c "	$q	" photo-candidates-muc/list.tsv 2>/dev/null || echo 0) -ge 3 ] && continue
              n=$(ls photo-candidates-muc/*.jpg 2>/dev/null | wc -l); f=$(printf "c%02d" $((n+1)))
              curl -sSfL -A "$UA" "$url" -o "/tmp/$f" || { echo "IMGFAIL $url"; continue; }
              cp "/tmp/$f" "photo-candidates-muc/$f.jpg"
              printf "%s\t%s\t%s\t%s\t%s\n" "$f" "$q" "$title" "$lic" "$artist" >> photo-candidates-muc/list.tsv
            done
          done
          cat photo-candidates-muc/list.tsv || true
      - name: Commit
        run: |
          git config user.name taxicheck; git config user.email glad2trans@gmail.com
          git add photo-candidates-muc
          git commit -m "Кандидаты фото обложки Мюнхена (Wikimedia Commons)" || exit 0
          git push origin HEAD:design
